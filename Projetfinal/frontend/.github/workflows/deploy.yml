name: Deploy BS3 Frontend

on:
  push:
    branches:
      - principal
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "Projet final/frontend/package-lock.json"

      - name: Installer les dependances
        working-directory: "Projet final/frontend"
        run: npm ci

      - name: Construire le frontend
        working-directory: "Projet final/frontend"
        run: npm run build

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparer les fichiers du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "Projet final/frontend/dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
